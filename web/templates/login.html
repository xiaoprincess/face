<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 器材申请系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #667eea; font-size: 32px; margin-bottom: 10px; }
        .logo p { color: #999; font-size: 14px; }
        h2 { text-align: center; color: #333; margin-bottom: 30px; font-size: 24px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        
        .input-icon { position: relative; }
        .input-icon input {
            width: 100%; padding: 12px 15px 12px 45px;
            border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px;
            transition: all 0.3s;
        }
        .input-icon input:focus {
            outline: none; border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .input-icon .icon {
            position: absolute; left: 15px; top: 50%;
            transform: translateY(-50%); color: #999; font-size: 18px;
        }
        
        button {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s; margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        
        .btn-face {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }
        .btn-face:hover { box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3); }
        
        .divider {
            display: flex; align-items: center; text-align: center; margin: 25px 0;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; border-bottom: 1px solid #e0e0e0;
        }
        .divider span { padding: 0 15px; color: #999; font-size: 14px; }
        
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #667eea; text-decoration: none; font-weight: 500; }
        .links a:hover { text-decoration: underline; }
        
        .error {
            background: #fee; color: #c33; padding: 12px;
            border-radius: 10px; margin-bottom: 20px; text-align: center;
        }
        
        .success {
            background: #efe; color: #3c3; padding: 12px;
            border-radius: 10px; margin-bottom: 20px; text-align: center;
        }
        
        .test-account {
            margin-top: 20px; padding: 15px; background: #f5f5f5;
            border-radius: 10px; font-size: 14px;
        }
        .test-account p { color: #666; margin-bottom: 5px; }
        .test-account strong { color: #667eea; }
        
        /* 人脸识别模态框 */
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center; z-index: 1000;
        }
        
        .modal-content {
            background: white; border-radius: 20px; padding: 30px;
            max-width: 450px; width: 90%; animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .modal-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
        }
        .modal-header h3 { color: #333; font-size: 20px; }
        
        .close { font-size: 28px; font-weight: bold; cursor: pointer; color: #999; }
        .close:hover { color: #333; }
        
        #faceVideo {
            width: 100%; border-radius: 15px;
            border: 3px solid #28a745; background: #000;
        }
        
        .face-status { margin-top: 15px; padding: 10px; border-radius: 10px; font-size: 14px; text-align: center; }
        .face-status.info { background: #e8f0fe; color: #667eea; }
        .face-status.success { background: #d4edda; color: #155724; }
        .face-status.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🏢 器材管家</h1>
            <p>实验器材申请管理系统</p>
        </div>
        
        <h2>用户登录</h2>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        {% if success %}
        <div class="success">{{ success }}</div>
        {% endif %}
        
        <!-- 账号密码登录 -->
        <form method="POST" action="/login">
            <div class="form-group">
                <label>用户名</label>
                <div class="input-icon">
                    <span class="icon">👤</span>
                    <input type="text" name="username" required placeholder="请输入用户名" value="{{ username or '' }}">
                </div>
            </div>
            
            <div class="form-group">
                <label>密码</label>
                <div class="input-icon">
                    <span class="icon">🔒</span>
                    <input type="password" name="password" required placeholder="请输入密码">
                </div>
            </div>
            
            <button type="submit" class="btn-primary">🔐 账号密码登录</button>
        </form>
        
        <!-- 分隔线 -->
        <div class="divider">
            <span>或选择其他登录方式</span>
        </div>
        
        <!-- 人脸登录按钮 -->
        <button type="button" class="btn-face" onclick="openFaceLoginModal()">
            😊 人脸识别登录
        </button>
        
        <div class="links">
            <a href="/register">还没有账号？立即注册</a>
        </div>
    </div>
    
    <!-- 人脸识别模态框 -->
    <div id="faceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>😊 人脸识别登录</h3>
                <span class="close" onclick="closeFaceLoginModal()">&times;</span>
            </div>
            
            <video id="faceVideo" autoplay playsinline muted></video>
            <canvas id="faceCanvas" style="display: none;"></canvas>
            
            <div id="faceStatus" class="face-status info">
                <span id="faceStatusText">正在初始化摄像头...</span>
            </div>
            
            <button type="button" class="btn-face" id="faceVerifyBtn" onclick="verifyFace()" disabled>
                开始识别
            </button>
        </div>
    </div>
    
    <script>
    let stream = null;

    function openFaceLoginModal() {
        document.getElementById('faceModal').style.display = 'flex';
        initCamera();
    }

    function closeFaceLoginModal() {
        document.getElementById('faceModal').style.display = 'none';
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }
    }

    async function initCamera() {
        const video = document.getElementById('faceVideo');
        const statusText = document.getElementById('faceStatusText');
        const statusDiv = document.getElementById('faceStatus');
        const verifyBtn = document.getElementById('faceVerifyBtn');
        
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: 640, height: 480 }
            });
            video.srcObject = stream;
            statusDiv.className = 'face-status success';
            statusText.textContent = '✅ 摄像头已就绪，请点击识别按钮';
            verifyBtn.disabled = false;
        } catch (err) {
            statusDiv.className = 'face-status error';
            statusText.textContent = '❌ 无法访问摄像头，请确保已授权';
            verifyBtn.disabled = true;
        }
    }

    async function verifyFace() {
        const video = document.getElementById('faceVideo');
        const canvas = document.getElementById('faceCanvas');
        const statusText = document.getElementById('faceStatusText');
        const statusDiv = document.getElementById('faceStatus');
        const verifyBtn = document.getElementById('faceVerifyBtn');
        
        // 拍照
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = canvas.toDataURL('image/jpeg');
        
        verifyBtn.disabled = true;
        verifyBtn.textContent = '识别中...';
        statusDiv.className = 'face-status info';
        statusText.textContent = '🔍 正在识别您的人脸...';
        
        try {
            const response = await fetch('/api/face_login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ image: imageData })
            });
            
            const result = await response.json();
            
            if (result.success) {
                statusDiv.className = 'face-status success';
                statusText.textContent = `✅ ${result.message}，正在跳转...`;
                
                // 跳转到对应页面
                setTimeout(() => {
                    window.location.href = result.redirect;
                }, 1000);
            } else {
                statusDiv.className = 'face-status error';
                statusText.textContent = `❌ ${result.message}`;
                verifyBtn.disabled = false;
                verifyBtn.textContent = '重新识别';
            }
        } catch (err) {
            statusDiv.className = 'face-status error';
            statusText.textContent = '❌ 网络错误，请检查服务器连接';
            verifyBtn.disabled = false;
            verifyBtn.textContent = '重新识别';
        }
    }

    // 点击模态框外部关闭
    window.onclick = function(event) {
        const modal = document.getElementById('faceModal');
        if (event.target === modal) {
            closeFaceLoginModal();
        }
    };

    // 页面卸载时关闭摄像头
    window.addEventListener('beforeunload', function() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
    });
    </script>
</body>
</html>
