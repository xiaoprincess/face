# ============================================================
# Nginx 反向代理配置 - 器材申请管理系统
#
# 架构:
#   ESP32  ──HTTP (:80)──▶ Nginx ──▶ Flask :5000
#   浏览器  ──HTTPS (:443)──▶ Nginx ──▶ Flask :5000
#
# 部署步骤（树莓派 / Linux）:
#   1. sudo apt install nginx
#   2. sudo cp face_nginx.conf /etc/nginx/sites-available/face
#   3. sudo ln -s /etc/nginx/sites-available/face /etc/nginx/sites-enabled/
#   4. sudo rm /etc/nginx/sites-enabled/default  (可选，去掉默认站点)
#   5. 修改下方 ssl_certificate / ssl_certificate_key 路径为本机实际路径
#   6. sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# HTTP :80 —— 给 ESP32 使用
server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如果未来需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTPS :443 —— 给浏览器使用（调用摄像头需要 HTTPS）
server {
    listen 443 ssl http2;
    server_name _;

    # ★★★ 请修改为实际证书路径 ★★★
    ssl_certificate     /home/xiao/face/web/cert.pem;
    ssl_certificate_key /home/xiao/face/web/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
