{% extends "base.html" %}
{% block title %}小智零件社区{% endblock %}
{% block content %}
<section class="hero">
    <div class="hero-copy">
        <p class="eyebrow">AI · 零件管理 · 团队协作</p>
        <h1>让每一个零件，都更容易被找到</h1>
        <p>在一个清晰的工作台里完成借用登记、柜体定位、项目讨论、实时聊天和资料管理。</p>
        <div class="actions">
            <a class="button primary" href="{{ url_for('auth.register') }}">立即开始</a>
            <a class="button" href="{{ url_for('auth.login') }}">已有账号，登录</a>
        </div>
    </div>
    <div class="hero-preview" aria-hidden="true">
        <div class="preview-window">
            <div class="preview-header"><i></i><i></i><i></i></div>
            <div class="preview-body">
                <div class="preview-title"></div>
                <div class="preview-row"><span class="preview-icon">◫</span><span class="preview-lines"><span></span><span></span></span><span class="preview-status">已定位</span></div>
                <div class="preview-row"><span class="preview-icon">💬</span><span class="preview-lines"><span></span><span></span></span><span class="preview-status">在线</span></div>
                <div class="preview-row"><span class="preview-icon">📁</span><span class="preview-lines"><span></span><span></span></span><span class="preview-status">已同步</span></div>
            </div>
        </div>
    </div>
</section>
<section class="landing-feature-grid" aria-label="平台功能">
    <article class="landing-feature"><span class="card-icon">◫</span><h2>零件管家</h2><p>登记借用、自动匹配柜子，随时查阅借用记录。</p></article>
    <article class="landing-feature"><span class="card-icon">💬</span><h2>实时私聊</h2><p>与项目成员一对一沟通，及时交流器材和项目进展。</p></article>
    <article class="landing-feature"><span class="card-icon">📁</span><h2>项目云盘</h2><p>安全保存数据手册、BOM 和装配说明。</p></article>
</section>
{% endblock %}
