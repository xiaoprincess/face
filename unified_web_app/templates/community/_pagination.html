{% if pagination.pages > 1 %}
<nav class="list-pagination" aria-label="列表翻页">
    {% if pagination.has_prev %}<a class="button small" href="{{ url_for(request.endpoint, page=pagination.prev_num) }}">上一页</a>{% endif %}
    <span>第 {{ pagination.page }} / {{ pagination.pages }} 页 · 共 {{ pagination.total }} 条</span>
    {% if pagination.has_next %}<a class="button small" href="{{ url_for(request.endpoint, page=pagination.next_num) }}">下一页</a>{% endif %}
</nav>
{% endif %}
